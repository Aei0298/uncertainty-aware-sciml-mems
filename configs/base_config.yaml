# ============================================================
# Base configuration
# Deterministic MEMS dynamical-system simulation
# ============================================================

project:
  name: "monte_carlo_mems_sciml"
  seed: 9512

simulation:
  start_time: 0.0
  end_time: 2.0

  sampling_frequency: 10000

  solver:
    method: "RK45"
    rtol: 1.0e-8
    atol: 1.0e-10

initial_conditions:
  displacement: 0.0
  velocity: 0.0

physical_model:
  model_type: "nonlinear_mass_spring_damper"

  mass: 1.0

  damping: 0.08

  stiffness: 1000.0

  nonlinear_stiffness: 0.0

excitation:
  type: "chirp"

  amplitude: 1.0

  start_frequency: 1.0
  end_frequency: 20.0

sensor:
  output: "acceleration"

  gain: 1.0
  bias: 0.0

  noise:
    enabled: false
    standard_deviation: 0.0

environment:
  reference_temperature: 25.0
  temperature: 25.0

  ageing: 0.0
  mechanical_stress: 0.0